name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 26.04 runners do not provide Python 3.9 in the tool cache.
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q codeyear
      - name: Lint
        run: ruff check codeyear tests tools
      - name: Tests
        run: pytest -q --cov=codeyear --cov-report=term-missing --cov-fail-under=75
