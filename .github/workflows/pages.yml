name: Deploy demo to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行会自动开启 Pages；如果仓库策略不允许，请在
          # Settings → Pages 里手动把 Source 设为 GitHub Actions。
          enablement: true

      - name: Sync version.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          ver_file = Path("docs/version.json")
          existing = json.loads(ver_file.read_text(encoding="utf-8")) if ver_file.exists() else {}
          ver = existing.get("version", "0.2.15")
          repo = os.environ.get("REPO") or "Qiongkura/codeyear"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/latest",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  rel = json.loads(resp.read().decode("utf-8"))
                  assets = {a.get("name") for a in (rel.get("assets") or [])}
                  tag = (rel.get("tag_name") or "").lstrip("vV")
                  if tag and "CodeYear.exe" in assets and f"codeyear-{tag}-py3-none-any.whl" in assets:
                      ver = tag
          except Exception as exc:
              print(f"Keeping existing version.json ({ver}): {exc}")
          base = f"https://github.com/{repo}/releases/download/v{ver}"
          ver_file.write_text(json.dumps({
              "version": ver,
              "wheel_url": f"{base}/codeyear-{ver}-py3-none-any.whl",
              "exe_url": f"{base}/CodeYear.exe",
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
