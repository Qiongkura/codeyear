name: Publish to PyPI

on:
  # 先在 PyPI 配置 trusted publisher：
  #   owner: Qiongkura
  #   repository: codeyear
  #   workflow: publish.yml
  #   environment: pypi
  # 配置好后取消下面三行注释即可在发布 Release 时自动上传。
  # release:
  #   types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/codeyear/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
