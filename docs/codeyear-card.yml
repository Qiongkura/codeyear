name: Update CodeYear card

on:
  schedule:
    # 每天 04:00 UTC（北京时间 12:00）
    - cron: "0 4 * * *"
    # 想每周更新：换成 "0 4 * * 1"
    # 想每月更新：换成 "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codeyear-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CodeYear
        # 固定到 release tag，避免每天自动执行 main 上的最新改动。
        run: >
          pip install "codeyear @
          git+https://github.com/Qiongkura/codeyear.git@${CODEYEAR_REF}"
        env:
          CODEYEAR_REF: v0.2.1

      - name: Generate card and update README
        run: >
          codeyear github ${{ github.repository_owner }}
          --year $(date +%Y)
          --fallback-previous
          --max-commits 500
          --card-only
          --out "$RUNNER_TEMP/codeyear"
          --profile-repo .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A 会把 update_profile 清理掉的旧版本 SVG 删除也一起暂存；
          # glob magic 同时覆盖根目录和 assets/ 子目录里的卡片。
          git add -A README.md ':(glob)**/codeyear-*.svg'
          if git diff --cached --quiet; then
            echo "Card is already up to date."
            exit 0
          fi
          git commit -m "Update CodeYear card [skip ci]"
          git push
