name: Update CodeYear card

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CodeYear
        run: pip install git+https://github.com/Qiongkura/codeyear.git

      - name: Generate public card
        run: codeyear github ${{ github.repository_owner }} --year $(date +%Y) --out .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codeyear-*-card.svg codeyear-*-card-dark.svg codeyear-*-embed.md
          git diff --cached --quiet || git commit -m "Update CodeYear card"
          git push
